<style>
:root{--bg:#eef1f6;--panel:#fff;--text:#1a2433;--muted:#5b6678;--line:#d5dce8;--blue:#004188;--red:#e7000e;--on-blue:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1522;--panel:#142033;--text:#e8edf5;--muted:#9aa9bf;--line:#26364d;--blue:#1f6fd0;--red:#ff3b47;--on-blue:#fff}}
:root[data-theme="dark"]{--bg:#0c1522;--panel:#142033;--text:#e8edf5;--muted:#9aa9bf;--line:#26364d;--blue:#1f6fd0;--red:#ff3b47;--on-blue:#fff}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Montserrat,Arial,sans-serif;font-size:14px}
.app{max-width:1200px;margin:0 auto;padding:16px}
.top{background:#004188;color:#fff;border-bottom:5px solid var(--red);padding:calc(18px + env(safe-area-inset-top,0px)) 20px 16px}
.top>div{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{background:#fff;border-radius:6px;padding:6px 12px;display:flex;align-items:center}
.brand img{display:block;height:44px;width:auto}
h1{font-size:22px;margin:0 0 4px;font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:.01em}
.sub{color:rgba(255,255,255,.85);margin:0;font-size:13px}
.grid{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:12px;overflow:hidden}
.card h2{display:inline-block;font-size:11px;font-weight:700;margin:-14px 0 12px -14px;padding:6px 12px;text-transform:uppercase;letter-spacing:.07em;color:#fff;background:#004188;border-radius:0 0 6px 0}
label.file{display:block;border:1.5px dashed var(--line);border-radius:6px;padding:10px;cursor:pointer;margin-bottom:8px}
label.file b{display:block;font-size:13px}
label.file span{color:var(--muted);font-size:12px}
label.file input{display:none}
label.file:hover{border-color:var(--blue)}
label.file.ok{border-color:var(--blue);border-style:solid}
button{font:inherit;background:var(--blue);color:var(--on-blue);border:0;border-bottom:3px solid var(--red);border-radius:6px;padding:9px 14px 7px;cursor:pointer;font-weight:700}
button.sec{background:transparent;color:var(--text);border:1px solid var(--line);border-bottom:3px solid var(--blue);padding:8px 13px 6px}
button:not(:disabled):hover{filter:brightness(1.1)}
button:focus-visible,select:focus-visible{outline:2px solid var(--red);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
select{font:inherit;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px;max-width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
input[type=range]{accent-color:var(--blue)}
.status{font-size:12px;color:var(--muted);line-height:1.5}
.status .warn{color:var(--red);font-weight:600}
.cols{font-size:11.5px;color:var(--muted);line-height:1.6;word-break:break-word}
.cols code{background:var(--bg);padding:1px 4px;border-radius:4px}
.stage{overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;justify-content:center}
.wrap{width:calc(105mm*var(--z,1.6));height:calc(148mm*var(--z,1.6));flex:none}
.wrap:not(.cur){display:none}
.page{position:relative;width:calc(105mm*var(--k,1));height:calc(148mm*var(--k,1));background:#fff;color:#1a1a1a;overflow:hidden;transform:scale(calc(var(--z,1.6)/var(--k,1)));transform-origin:top left;box-shadow:0 2px 14px rgba(0,0,0,.18);font-family:Montserrat,Arial,sans-serif}
.page>.sc{position:absolute;left:0;top:0;width:105mm;height:148mm;transform:scale(var(--k,1));transform-origin:0 0}
.sc>*{position:absolute}
.hd{left:0;right:0;top:0;height:19.7mm;background:#004b8d}
.tipo{left:9mm;top:1.8mm;width:62mm;height:8.8mm;color:#fff;font-weight:700;display:flex;align-items:center;overflow:hidden;line-height:1.1;text-transform:uppercase}
.modelo{left:9mm;top:10.8mm;width:62mm;height:7.4mm;color:#fff;font-weight:500;display:flex;align-items:center;overflow:hidden;line-height:1.1}
.logo{left:72mm;top:2.3mm;width:29.5mm;height:15mm;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;overflow:hidden;text-align:center}
.logo img,.img>img,.ase img,.bm{max-width:100%;max-height:100%;object-fit:contain}
.img{left:3.6mm;top:23.1mm;width:46.8mm;height:51.8mm;border:.3mm solid #e1e2f1;display:flex;align-items:center;justify-content:center;padding:2mm;color:#b6bccb;font-size:5pt}
.pic{position:absolute;left:1.2mm;bottom:1.2mm;width:11mm;height:11mm}
.pic img{width:100%;height:100%;object-fit:contain;object-position:left bottom}
.ref{flex:none;width:38mm;height:14mm;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;color:#4b5563;overflow:hidden}
.tab{left:52.4mm;top:23.1mm;width:49.1mm;height:51.8mm;border-top:.8mm solid #004b8d;border-bottom:.8mm solid #004b8d;display:flex;flex-direction:column}
.tr{flex:1;display:flex;min-height:0}
.tr:nth-child(odd){background:#e6e5e6}
.td{display:flex;align-items:center;overflow:hidden;line-height:1.2;min-width:0}
.td.n{width:52.7%;padding:0 1mm 0 3mm;font-weight:600;color:#1f2c44}
.td.v{width:47.3%;padding:0 1mm 0 1.5mm}
.inc,.add{top:76.8mm;height:calc(24mm + 10mm*(var(--k,1) - 1));display:flex;flex-direction:column}
.inc{left:3.4mm;width:47mm;border:.25mm solid #004b8d}
.add{left:52.5mm;width:49mm;border:.25mm solid #ed1c24}
.lab{margin:1.9mm 0 0 -.25mm;align-self:flex-start;display:flex;align-items:center;color:#fff;font-weight:700;font-size:5.6pt;padding:.5mm 2mm .5mm 1.8mm;line-height:1.25;white-space:nowrap}

function pageHTML(r){
 const img=getImg(r),lg=getLogo(r),pc=getPicto(r);
 let t='';
 for(let k=1;k<=5;k++){
  t+=`<div class="tr"><div class="td n fit" data-max="9" data-min="4.5">${esc(pick(r,['NOMBRE_CARACTERISTICA_'+k,'NOMBRE_CARACT_'+k]))}</div><div class="td v fit" data-max="9" data-min="4.5">${esc(pick(r,['CARACTERISTICA_'+k,'CARACT_'+k]))}</div></div>`;
 }
 return `<div class="wrap"><div class="page"><div class="sc">
  <div class="hd"></div>
  <div class="tipo fit" data-max="17" data-min="8">${esc(r.TIPOLOGIA)}</div>
  <div class="modelo fit" data-max="13" data-min="6">${esc(r.MODELO)}</div>
  <div class="logo fit" data-max="9" data-min="5">${lg?`<img src="${lg}" alt="">`:esc(r.MARCA)}</div>
  <div class="img">${img?`<img class="prod" data-o="${img}" src="${img}" alt="">`:(r.IMAGEN?'Sin imagen: '+esc(r.IMAGEN):'Sin imagen')}${pc?`<div class="pic"><img src="${pc}" alt=""></div>`:''}</div>
  <div class="tab">${t}</div>
  <div class="inc"><div class="lab">Incluye:</div><div class="txt fit" data-max="8" data-min="4">${String(r.INCLUYE||'').split(/\r?\n|;|\|/).map(x=>x.trim()).filter(Boolean).map(x=>'<div class="dl">- '+esc(x)+'</div>').join('')}</div></div>
  <div class="add"><div class="lab">Añade y mejora tu compra</div><div class="txt fit" data-max="8" data-min="4">${esc(r.ANADE)}</div></div>
  <div class="grp"><div class="ase"><img src="${ASE}" alt=""></div><div class="ref fit" data-max="11" data-min="6">Ref. ${esc(ln8(r.CODIGO_LN))}</div></div>
  <div class="ft"></div><div class="ft2"></div>
  <img class="bm" src="${BM}" alt="">
 </div><div class="cut"></div></div></div>`;
}

function fit(){
 document.body.classList.add('measure');
 const k=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--k'))||1;
 const mx=el=>(+el.dataset.max)*(el.classList.contains('txt')?1+.3*(k-1):1);
 document.querySelectorAll('.inc,.add').forEach(b=>{const t=b.querySelector('.txt'),l=b.querySelector('.lab');if(t&&l)l.style.fontSize=mx(t)+'pt'});
 document.querySelectorAll('.fit').forEach(el=>{
  let s=mx(el),m=+el.dataset.min;
  el.style.fontSize=s+'pt';
  let g=160;
  while(g-->0&&s>m&&(el.scrollHeight>el.clientHeight+1||el.scrollWidth>el.clientWidth+1)){s-=.25;el.style.fontSize=s+'pt'}
 });
 document.querySelectorAll('.tab').forEach(t=>['n','v'].forEach(c=>{
  const els=[...t.querySelectorAll('.td.'+c)];
  const m=Math.min(...els.map(e=>parseFloat(e.style.fontSize)));
  els.forEach(e=>e.style.fontSize=m+'pt');
 }));
 document.querySelectorAll('.inc,.add').forEach(b=>{const t=b.querySelector('.txt'),l=b.querySelector('.lab');if(!(t&&l))return;let s=parseFloat(t.style.fontSize);l.style.fontSize=s+'pt';let g=160;while(g-->0&&s>3&&l.offsetWidth>b.clientWidth-1){s-=.25;l.style.fontSize=s+'pt'}t.style.fontSize=s+'pt'});
 document.body.classList.remove('measure');
}

function cutout(d,W,H){
 const p=d.data,N=W*H;

async function isolateUrl(u){
 if(u in procCache)return procCache[u];
 let res=u;
 try{
  const im=await loadImage(u);
  const S=Math.min(1,1100/Math.max(im.naturalWidth,im.naturalHeight));
  const W=Math.max(1,Math.round(im.naturalWidth*S)),H=Math.max(1,Math.round(im.naturalHeight*S));
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const cx=cv.getContext('2d',{willReadFrequently:true});
  cx.drawImage(im,0,0,W,H);
  const d=cx.getImageData(0,0,W,H);
  const bb=cutout(d,W,H);
  if(bb){
   cx.putImageData(d,0,0);
   const m=Math.round(Math.max(bb[2]-bb[0],bb[3]-bb[1])*0.02);
   const X0=Math.max(0,bb[0]-m),Y0=Math.max(0,bb[1]-m),X1=Math.min(W,bb[2]+m+1),Y1=Math.min(H,bb[3]+m+1);
   const c2=document.createElement('canvas');c2.width=X1-X0;c2.height=Y1-Y0;
   c2.getContext('2d').drawImage(cv,X0,Y0,X1-X0,Y1-Y0,0,0,X1-X0,Y1-Y0);
   const blob=await new Promise(r=>c2.toBlob(r,'image/png'));
   if(blob)res=URL.createObjectURL(blob);
  }
 }catch(e){res=u}
 procCache[u]=res;return res;
}
let isoRun=0;
async function isolate(){

 els.sort((a,b)=>(b.closest('.cur')?1:0)-(a.closest('.cur')?1:0));
 let n=0;
 for(const el of els){
  if(my!==isoRun)return;
  const o=el.dataset.o;
  if(!on){if(el.getAttribute('src')!==o)el.src=o;continue}
  if(!(o in procCache)){$('cnt').textContent='Aislando producto… '+(++n)+' / '+els.length;await new Promise(r=>setTimeout(r,0))}
  const u=await isolateUrl(o);
  if(my!==isoRun)return;
  if(el.getAttribute('src')!==u)el.src=u;

}

$('fx').onchange=async e=>{

 try{
  const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
  const heads=n=>(XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:'',raw:false})[0]||[]).map(h=>ALIAS[norm(h)]||norm(h));
  const hid=(wb.Workbook&&wb.Workbook.Sheets)||[];
  const visible=wb.SheetNames.filter((n,i)=>!(hid[i]&&hid[i].Hidden));
  const pick1=n=>{const h=heads(n);return h.includes('CODIGO_LN')&&h.includes('MODELO')};
  const sheet=visible.find(pick1)||wb.SheetNames.find(pick1)||visible[0]||wb.SheetNames[0];
  const raw=XLSX.utils.sheet_to_json(wb.Sheets[sheet],{defval:'',raw:false});
  const all=raw.map(o=>{const r={};Object.keys(o).forEach(k=>{const n=norm(k);r[ALIAS[n]||n]=String(o[k]).trim()});return r}).filter(r=>Object.values(r).some(v=>v!==''));
  const tpl={};
  all.forEach(r=>{if(!r.CODIGO_LN&&!r.MODELO&&r.TIPOLOGIA&&!tpl[key(r.TIPOLOGIA)])tpl[key(r.TIPOLOGIA)]=r});
  const catName=wb.SheetNames.find(n=>norm(n)==='CATALOGO');
  if(catName)XLSX.utils.sheet_to_json(wb.Sheets[catName],{defval:'',raw:false}).forEach(o=>{
   const r={};Object.keys(o).forEach(k=>{const n=norm(k);r[ALIAS[n]||n]=String(o[k]).trim()});
   if(r.TIPOLOGIA&&r.NOMBRE_CARACTERISTICA_1&&!tpl[key(r.TIPOLOGIA)])tpl[key(r.TIPOLOGIA)]=r;
  });
  ntpl=Object.keys(tpl).length;

async function sniff(f){
 if(/^image\//.test(f.type))return f.type;
 if(/\.svg$/i.test(f.name))return 'image/svg+xml';
 const u=new Uint8Array(await f.slice(0,12).arrayBuffer());
 const h=(...a)=>a.every((v,i)=>u[i]===v);
 if(h(0x89,0x50,0x4E,0x47))return 'image/png';
 if(h(0xFF,0xD8,0xFF))return 'image/jpeg';
 if(h(0x47,0x49,0x46,0x38))return 'image/gif';
 if(h(0x52,0x49,0x46,0x46)&&u[8]===0x57&&u[9]===0x45&&u[10]===0x42&&u[11]===0x50)return 'image/webp';
 if(h(0x42,0x4D))return 'image/bmp';
 return '';
}
function loadImgs(input,store,label,box,lab){
 input.onchange=async e=>{
  const all=[...e.target.files];if(!all.length)return;
  $(label).textContent='Leyendo carpeta…';
  const fs=[];
  for(const f of all){const t=await sniff(f);if(t)fs.push([f,t])}
  if(!fs.length){$(label).textContent='No se han encontrado imágenes en esa carpeta';return}
  const dir=(all[0].webkitRelativePath||'').split('/')[0];
  fs.forEach(([f,t])=>{const u=URL.createObjectURL(new Blob([f],{type:t}));store[key(f.name)]=u;store[stem(f.name)]=u;if(store===imgs){const k8=stem(f.name).slice(0,8);if(!(k8 in imgs8)||stem(f.name)===k8)imgs8[k8]=u}});
  $(label).textContent=(dir?'«'+dir+'» · ':'')+fs.length+' imágenes cargadas';$(box).classList.add('ok');
  if(rows.length)render();
 };
}
